[project]
name = "1ndeterminate"
dynamic = ["version"]
description = "Nodes, edges and methods: join models, programs, devices and people into graphs, and run them"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Standard library only.
dependencies = []

[project.scripts]
1ndeterminate = "indeterminate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indeterminate"]

[tool.hatch.version]
path = "src/indeterminate/__init__.py"
