[project]
name = "mch-harness"
dynamic = ["version"]
description = "A task-neutral multi-agent orchestration kernel: plan graph, deterministic scheduling, file boundaries, approvals, recoverable state, and a stdio MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Standard library only. git must be on PATH: every project is a git repository.
dependencies = []

[project.scripts]
mch-harness = "mch_harness.mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mch_harness"]

[tool.hatch.version]
path = "src/mch_harness/__init__.py"
